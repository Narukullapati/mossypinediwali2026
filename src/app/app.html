<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <app-marquee />
  <div class="header-main">
  <a class="brand" routerLink="/" aria-label="Mossy Pine Family Gathering — home">
    <span class="brand-text"><small>KBar · Mossy Pine</small><strong>Family Gathering</strong></span>
  </a>
  <button class="menu-btn" type="button" (click)="menuOpen = !menuOpen"
    [attr.aria-expanded]="menuOpen" aria-controls="main-nav">
    {{ menuOpen ? 'Close' : 'Menu' }}
  </button>
  <nav id="main-nav" [class.open]="menuOpen" aria-label="Main">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="menuOpen = false">Home</a>
    <a routerLink="/cultural" routerLinkActive="active" (click)="menuOpen = false">Cultural activity</a>
    <a routerLink="/food" routerLinkActive="active" (click)="menuOpen = false">Food</a>
    <a routerLink="/contact" routerLinkActive="active" (click)="menuOpen = false">Contact</a>
    <a routerLink="/admin" routerLinkActive="active" (click)="menuOpen = false">Admin</a>
    <a class="nav-cta" routerLink="/rsvp" routerLinkActive="active" (click)="menuOpen = false">RSVP</a>
  </nav>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>
